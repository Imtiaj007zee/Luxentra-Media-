<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#000000" />
    <meta name="google-site-verification" content="jzo_oaW5hIZrahwkgJ54rezRyP-OQZse6NbLIfrjxWo" />
    <meta
      name="description"
      content="Real estate branding, cinematic listing films, photography, and personal branding for realtors in NYC and Long Island. LuxEntra Media turns your viewers into clients."
    />
    <link rel="canonical" href="https://www.luxentramedia.com/" />
    <meta property="og:title" content="Personal Branding & Real Estate Film in NYC | LuxEntra Media" />
    <meta property="og:description" content="Personal branding for realtors in NYC and Long Island, planned, filmed, edited and posted for you, plus cinematic listing films and photography by LuxEntra Media." />
    <meta property="og:image" content="https://www.luxentramedia.com/og-image.jpg" />

    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://www.luxentramedia.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LuxEntra Media" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Personal Branding & Real Estate Film in NYC | LuxEntra Media" />
    <meta property="twitter:description" content="Real estate branding, cinematic listing films, photography, and personal branding for realtors in NYC and Long Island." />
    <meta property="twitter:image" content="https://www.luxentramedia.com/og-image.jpg" />
    <!-- Fonts are self-hosted now; see index.css. No Google Fonts
         request on this page anymore. -->
    <title>Personal Branding & Real Estate Film in NYC | LuxEntra Media</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "LuxEntra Media",
        "url": "https://www.luxentramedia.com/",
        "logo": "https://www.luxentramedia.com/logo-lockup.jpg",
        "image": "https://www.luxentramedia.com/og-image.jpg",
        "description": "Real estate branding, cinematic listing films, photography, and personal branding for realtors in NYC and Long Island.",
        "email": "luxentra.media@gmail.com",
        "priceRange": "$$",
        "areaServed": ["New York City", "Long Island", "Queens", "Brooklyn", "Bronx", "Nassau County", "Suffolk County"],
        "sameAs": ["https://www.instagram.com/luxentra.media"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Real Estate Media Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Photography" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Film and Listing Videos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Personal Branding for Realtors" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Branding and Social Media Management" } }
          ]
        }
      }
    </script>
  </head>
  <body style="margin: 0; background: #0b0b0b">
    <div id="root">
      <!-- Loading splash: shows instantly while the app bundle loads, so
           the first impression is the brand, not a blank screen. React
           replaces this whole block when it mounts. -->
      <div
        style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #0b0b0b;"
      >
        <div style="position: relative; width: 54px; height: 54px;">
          <div style="position: absolute; inset: 0; transform: rotate(45deg); display: flex; align-items: center; justify-content: center;">
            <div style="width: 54px; height: 12px; border-radius: 6px; background: #c7ff00;"></div>
          </div>
          <div style="position: absolute; inset: 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;">
            <div style="width: 54px; height: 12px; border-radius: 6px; background: #c7ff00;"></div>
          </div>
        </div>
        <div style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.35em; color: #c7ff00; padding-left: 0.35em;">
          LUXENTRA
        </div>
        <div style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; letter-spacing: 0.5em; color: rgba(255,255,255,0.45); padding-left: 0.5em; margin-top: -14px;">
          MEDIA
        </div>
      </div>
    </div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
