      name="description"
      content="Real estate branding, cinematic listing films, photography, and personal branding for realtors in NYC and Long Island. LuxEntra Media turns your viewers into clients."
    />

    <meta property="og:title" content="Personal Branding & Real Estate Film in NYC | LuxEntra Media" />
    <meta property="og:description" content="Personal branding for realtors in NYC and Long Island, planned, filmed, edited and posted for you, plus cinematic listing films and photography by LuxEntra Media." />

    <meta property="twitter:image" content="https://www.luxentramedia.com/og-image.jpg" />
    <!-- The LCP element is the logo mark behind the ring. Preload it so
         the browser discovers it in this document instead of waiting
         for React to render it. (Fonts are self-hosted now; see
         index.css. No Google Fonts request on this page anymore.) -->
    <link
      rel="preload"
      as="image"
      href="/logo-mark-cutout.webp"
      fetchpriority="high"
    />
    <title>Personal Branding & Real Estate Film in NYC | LuxEntra Media</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "LuxEntra Media",
        "url": "https://www.luxentramedia.com/",
        "logo": "https://www.luxentramedia.com/logo-lockup.jpg",
        "image": "https://www.luxentramedia.com/og-image.jpg",
        "description": "Real estate branding, cinematic listing films, photography, and personal branding for realtors in NYC and Long Island.",
        "email": "luxentra.media@gmail.com",
        "priceRange": "$$",
        "areaServed": ["New York City", "Long Island", "Queens", "Brooklyn", "Bronx", "Nassau County", "Suffolk County"],
        "sameAs": ["https://www.instagram.com/luxentra.media"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Real Estate Media Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Photography" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Film and Listing Videos" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Personal Branding for Realtors" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Real Estate Branding and Social Media Management" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react-app/main.tsx"></script>
  </body>
</html>
